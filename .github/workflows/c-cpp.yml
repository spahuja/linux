name: Linux Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, ir-build]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Runner: $RUNNER_NAME ($RUNNER_ARCH)"
          echo "CPU cores: $(nproc)"
          free -h | head -2
          df -h /

      - name: Install ccache
        run: sudo apt-get install -y -qq ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kernel-ccache-defconfig-${{ hashFiles('Makefile') }}
          restore-keys: |
            kernel-ccache-defconfig-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      - name: Configure kernel (defconfig)
        run: make defconfig

      - name: Build kernel with ccache
        run: make -j$(nproc) CC="ccache gcc"

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Show built artifacts
        run: ls -lh arch/x86/boot/
