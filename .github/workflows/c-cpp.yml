name: Linux Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, ir-cold]
    timeout-minutes: 30
    container:
      image: ubuntu:24.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves

      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "CPU cores: $(nproc)"
          free -h | head -2
          df -h /

      - name: Configure kernel (defconfig)
        run: make defconfig

      - name: Build kernel
        run: make -j$(nproc)

      - name: Show built artifacts
        run: ls -lh arch/x86/boot/
