name: Linux Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, ir-build]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Runner: $RUNNER_NAME ($RUNNER_ARCH)"
          echo "CPU cores: $(nproc)"
          free -h | head -2
          df -h /

      - name: Verify build tools
        run: |
          gcc --version | head -1
          make --version | head -1
          docker version --format '{{.Server.APIVersion}}' || echo "docker not ready"

      - name: Configure kernel (defconfig)
        run: make defconfig

      - name: Build kernel
        run: make -j$(nproc)

      - name: Show built artifacts
        run: ls -lh arch/x86/boot/
