name: Linux Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, ir-cold]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Runner: $RUNNER_NAME ($RUNNER_ARCH)"
          echo "CPU cores: $(nproc)"
          free -h | head -2
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves

      - name: Configure kernel (defconfig)
        run: make defconfig

      - name: Build kernel
        run: make -j$(nproc)

      - name: Show built artifacts
        run: ls -lh arch/x86/boot/
